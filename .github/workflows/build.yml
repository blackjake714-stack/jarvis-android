name: Build JARVIS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Unzip uploaded project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n1)
          echo "Found: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper
        working-directory: extracted/JARVIS
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: extracted/JARVIS
        run: chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: extracted/JARVIS/app/build/outputs/apk/debug/app-debug.apk
